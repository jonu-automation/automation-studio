name: Checks
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.3
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: node scripts/check-db.mjs
      - run: pnpm build
      - run: node scripts/check-compiled.mjs
      - name: Verify running local API
        run: |
          pnpm local > "$RUNNER_TEMP/automation-studio.log" 2>&1 &
          demo_pid=$!
          trap 'kill "$demo_pid" 2>/dev/null || true' EXIT
          node --input-type=module -e 'let ready=false; for(let i=0;i<60;i++){try{const r=await fetch("http://127.0.0.1:8080/api/healthz");if(r.ok){ready=true;break}}catch{}await new Promise(r=>setTimeout(r,500))}if(!ready)process.exit(1)'
          node scripts/smoke-local.mjs
